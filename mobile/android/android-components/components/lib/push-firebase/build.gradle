plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
}

android {
    namespace = 'mozilla.components.lib.push.firebase'

    // Required for java.time APIs on Android 7 (API 24); restored from 1.1.x
    // (removed upstream in Bug 1969392 when minSdk was 26).
    compileOptions {
        coreLibraryDesugaringEnabled = true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    api libs.firebase.messaging

    implementation project(':components:concept-push')
    implementation project(':components:support-base')

    implementation libs.kotlinx.coroutines
    implementation libs.play.services.base

    testImplementation project(':components:support-test')

    testImplementation libs.androidx.test.core
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit4
    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.junit.vintage
    testImplementation libs.robolectric
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)
